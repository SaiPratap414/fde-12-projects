name: Daily FDE Project Publish

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fde-daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish next project
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_OWNER: saipratap414
        run: node scripts/publish-next.mjs

      - name: Commit advanced state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule/state.json
          git diff --staged --quiet || git commit -m "chore: advance publish state [skip ci]"
          git push
